# Publishes the site to GitHub Pages on every push to main.
# Live at https://yourguyphil.github.io/tft-hyperpop-reroll-guide/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stage site files (skip tools, print sources, deploy scripts)
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js favicon.ico assets hyperpop-reroll-guide.html hyperpop-reroll-guide.pdf _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
